<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4fix · ช่างใกล้ฉัน</title>
<meta name="description" content="หาร้านซ่อมคอม ปริ้นเตอร์ มือถือ ทีวี แอร์ ใกล้บ้าน — รวมร้านจาก Google Maps พร้อมระยะทาง เบอร์โทร นำทาง">
<meta property="og:title" content="4fix · ช่างใกล้ฉัน">
<meta property="og:description" content="หาร้านซ่อมคอม ปริ้นเตอร์ มือถือ ทีวี แอร์ ใกล้บ้าน">
<meta property="og:image" content="hero.jpg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f6f6;--sf:#fff;--sf2:#eaf1f1;--line:#d5e0e0;--fg:#16262a;--mut:#51666b;--ac:#0d7a6f;--acf:#fff;--or:#e07a1f;--star:#c98408;--ok:#16924f;--warn:#b9480f;--sh:0 1px 2px rgba(20,40,40,.06),0 6px 18px rgba(20,40,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1719;--sf:#162124;--sf2:#1d2b2f;--line:#2b3c41;--fg:#e8f0f0;--mut:#a3b5b8;--ac:#2fb9a9;--acf:#06211e;--or:#f0954a;--star:#f0b43a;--ok:#36c173;--warn:#f0894a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
.gut{padding-inline:max(16px,env(safe-area-inset-left))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}

.hero{background:linear-gradient(90deg,#cfe6e4 0,#cfe6e4 38%,rgba(207,230,228,0) 75%),#cfe6e4 url(hero.jpg) right 20%/auto 130% no-repeat;border-bottom:1px solid var(--line)}
@media (max-width:640px){.hero{background:linear-gradient(90deg,#cfe6e4 0,rgba(207,230,228,.92) 55%,rgba(207,230,228,.2) 100%),#cfe6e4 url(hero.jpg) 72% 20%/auto 140% no-repeat}}
.hero .in{max-width:1100px;margin:auto;padding-block:22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.hero h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.1;color:#0b3f3a;letter-spacing:-.5px}
.hero h1 b{color:var(--or)}
.hero p{margin:6px 0 0;max-width:19em;color:#27494a;font-size:15.5px}

.bar{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--line)}
.bar .in{max-width:1100px;margin:auto;padding-block:10px;display:flex;flex-direction:column;gap:9px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--sf2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.chip small{color:var(--mut);font-weight:500;margin-left:3px}
.chip.on{background:var(--ac);color:var(--acf);border-color:transparent}.chip.on small{color:inherit;opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.q{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--sf2);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.q input{flex:1;border:0;background:none;outline:0;padding:10px 0;min-width:0}
select,.btn{background:var(--sf2);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.btn.pri{background:var(--ac);color:var(--acf);border-color:transparent;font-weight:700}
.where{font-size:14px;color:var(--mut)}.where b{color:var(--fg)}

main{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;padding-block:14px}
@media (max-width:820px){main{grid-template-columns:1fr}}
#map{height:calc(100dvh - 190px);min-height:340px;position:sticky;top:132px;border-radius:14px;border:1px solid var(--line);overflow:hidden;z-index:1}
@media (max-width:820px){#map{position:relative;top:0;height:42vh;order:-1}}
#list{display:flex;flex-direction:column;gap:10px}
.cnt{color:var(--mut);font-size:14px;margin:2px 2px 0}.cnt b{color:var(--fg)}
.card{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:13px 14px;box-shadow:var(--sh)}
.card.sel{outline:3px solid var(--or)}
.card h3{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12.5px;font-weight:600;color:#fff;background:var(--c);border-radius:999px;padding:1px 9px;margin-right:6px;vertical-align:1px}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px 14px;font-size:14.5px;color:var(--mut)}
.meta .d{color:var(--ac);font-weight:700}.meta .r{color:var(--star);font-weight:700}
.addr{margin-top:5px;font-size:14.5px;color:var(--mut)}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;border-radius:11px;padding:9px 14px;border:1.5px solid var(--line);background:var(--sf2);color:var(--fg);min-height:42px}
.a.call{background:var(--ac);color:var(--acf);border-color:transparent}
.empty{padding:36px 8px;text-align:center;color:var(--mut)}
.more{align-self:center}
footer{max-width:1100px;margin:0 auto;padding-block:8px 28px;color:var(--mut);font-size:13px}
.leaflet-container{font-family:inherit}
</style>
</head>
<body>
<header class="hero"><div class="in gut">
  <h1><b>4</b>fix · ช่างใกล้ฉัน</h1>
  <p>ร้านซ่อมคอม ปริ้นเตอร์ มือถือ ทีวี แอร์ ใกล้บ้านคุณ</p>
</div></header>

<div class="bar"><div class="in gut">
  <div class="chips" id="chips" role="group" aria-label="หมวด"></div>
  <div class="row">
    <label class="q"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="ชื่อร้าน / ซอย / หมู่บ้าน เช่น พระปิ่น 3" autocomplete="off"></label>
    <select id="rad" aria-label="ระยะ"><option value="3">ใน 3 กม.</option><option value="5">ใน 5 กม.</option><option value="10">ใน 10 กม.</option><option value="25">ใน 25 กม.</option><option value="0" selected>ทุกระยะ</option></select>
    <select id="sort" aria-label="เรียง"><option value="near">ใกล้สุดก่อน</option><option value="rate">ดาวสูงสุด</option></select>
    <button class="btn pri" id="gps">📍 ใกล้ฉัน</button>
  </div>
  <div class="where" id="where"></div>
</div></div>

<main>
  <div id="map" aria-label="แผนที่ร้าน"></div>
  <section><div class="cnt" id="cnt"></div><div id="list"></div></section>
</main>
<footer class="gut">ข้อมูลร้านรวบรวมจาก Google Maps (ต.ค. 2569) · ดาวรีวิวเป็นของ Google ใช้ประกอบการตัดสินใจเท่านั้น ควรโทรสอบถามราคาและเวลาเปิดก่อนไปทุกครั้ง · แผนที่ © OpenStreetMap</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS={pc:['💻','คอม/โน้ตบุ๊ก','#0a8bb0'],prn:['🖨️','ปริ้นเตอร์','#a63f86'],mob:['📱','มือถือ','#5b5fe3'],tv:['📺','ทีวี','#16924f'],air:['❄️','แอร์','#2a77d4'],app:['🔌','เครื่องใช้ไฟฟ้า','#d0700a'],cam:['📷','กล้อง','#7a5a2e'],bat:['🔋','แบตเตอรี่','#dc1f4d']};
const SCHOOL={lat:13.851028,lng:100.403063,name:'โรงเรียนชุมชนวัดบางโค'};
let S=[],cat='',org={...SCHOOL},orgIsGps=false,shown=40,sel=null;
const $=id=>document.getElementById(id);
const km=(a,b)=>{const r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)/2*r),y=(b.lat-a.lat)*r;return Math.hypot(x,y)*6371};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([org.lat,org.lng],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const lay=L.layerGroup().addTo(map);
const me=L.circleMarker([org.lat,org.lng],{radius:9,color:'#fff',weight:3,fillColor:'#e07a1f',fillOpacity:1}).addTo(map).bindTooltip('จุดอ้างอิง');

function view(){
  const q=$('q').value.trim().toLowerCase(),R=+$('rad').value;
  let a=S.filter(s=>(!cat||s.cat===cat)&&(!q||(s.name+' '+s.addr+' '+s.type).toLowerCase().includes(q)));
  a.forEach(s=>s.d=km(org,s));
  if(R)a=a.filter(s=>s.d<=R);
  const by=$('sort').value;
  a.sort(by==='rate'?(x,y)=>(y.rating||0)-(x.rating||0)||x.d-y.d:(x,y)=>x.d-y.d);
  return a;
}
function render(){
  const a=view();
  $('cnt').innerHTML=`พบ <b>${a.length}</b> ร้าน`;
  // chips (count ตามตัวกรองอื่น)
  const q=$('q').value.trim().toLowerCase(),R=+$('rad').value,cn={};
  S.forEach(s=>{if(q&&!(s.name+' '+s.addr+' '+s.type).toLowerCase().includes(q))return;if(R&&km(org,s)>R)return;cn[s.cat]=(cn[s.cat]||0)+1});
  const tot=Object.values(cn).reduce((x,y)=>x+y,0);
  $('chips').innerHTML=`<button class="chip${cat?'':' on'}" data-c="">ทั้งหมด<small>${tot}</small></button>`+Object.entries(CATS).filter(([k])=>cn[k]).map(([k,v])=>`<button class="chip${cat===k?' on':''}" data-c="${k}">${v[0]} ${v[1]}<small>${cn[k]}</small></button>`).join('');
  lay.clearLayers();
  a.forEach(s=>{L.circleMarker([s.lat,s.lng],{radius:7,color:'#fff',weight:1.5,fillColor:CATS[s.cat][2],fillOpacity:.95}).addTo(lay).on('click',()=>pick(s.id)).bindTooltip(esc(s.name))});
  $('list').innerHTML=a.length?a.slice(0,shown).map(card).join('')+(a.length>shown?`<button class="btn more" id="more">แสดงเพิ่ม (อีก ${a.length-shown})</button>`:''):'<div class="empty">ไม่พบร้านตามเงื่อนไข<br>ลองขยายระยะหรือเลือก “ทั้งหมด”</div>';
}
function card(s){
  const c=CATS[s.cat],g=`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}&query_place_id=${s.id}`,
  dir=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&destination_place_id=${s.id}`;
  return `<article class="card${sel===s.id?' sel':''}" id="c-${esc(s.id)}" style="--c:${c[2]}">
  <h3>${esc(s.name)}</h3>
  <div class="meta"><span><span class="tag">${c[0]} ${c[1]}</span>${esc(s.type||'')}</span>
   <span class="d">${s.d<1?Math.round(s.d*1000)+' ม.':s.d.toFixed(1)+' กม.'}</span>
   ${s.rating?`<span class="r">★ ${s.rating.toFixed(1)}</span>`:'<span>ยังไม่มีรีวิว</span>'}
   ${s.hours?`<span>${esc(s.hours)}</span>`:''}</div>
  ${s.addr?`<div class="addr">${esc(s.addr)}</div>`:''}
  <div class="acts">${s.phone?`<a class="a call" href="tel:${s.phone.replace(/-/g,'')}">📞 ${s.phone}</a>`:''}<a class="a" href="${dir}" target="_blank" rel="noopener">🧭 นำทาง</a><a class="a" href="${g}" target="_blank" rel="noopener">รีวิวใน Maps</a></div></article>`;
}
function pick(id){
  sel=id;const s=S.find(x=>x.id===id);if(!s)return;
  const i=view().findIndex(x=>x.id===id);if(i>=shown)shown=i+1;
  render();const el=document.getElementById('c-'+id);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function setOrg(lat,lng,name,gps){
  org={lat,lng};orgIsGps=gps;me.setLatLng([lat,lng]);
  $('where').innerHTML=`ระยะทางนับจาก <b>${esc(name)}</b>${gps?'':' · กด “ใกล้ฉัน” เพื่อใช้ตำแหน่งปัจจุบัน'}`;
  shown=40;render();fit();
}
function fit(){const a=view().slice(0,15).map(s=>[s.lat,s.lng]);a.push([org.lat,org.lng]);map.fitBounds(a,{padding:[30,30],maxZoom:15})}

$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;shown=40;render();fit()};
$('q').oninput=()=>{shown=40;render()};
$('rad').onchange=()=>{shown=40;render();fit()};
$('sort').onchange=render;
$('list').onclick=e=>{if(e.target.id==='more'){shown+=40;render();return}const c=e.target.closest('.card');if(c&&!e.target.closest('a')){const id=c.id.slice(2),s=S.find(x=>x.id===id);sel=id;map.setView([s.lat,s.lng],16);render()}};
$('gps').onclick=()=>{
  if(!navigator.geolocation){alert('เครื่องนี้ไม่รองรับตำแหน่ง');return}
  $('gps').textContent='กำลังหาตำแหน่ง…';
  navigator.geolocation.getCurrentPosition(p=>{$('gps').textContent='📍 ใกล้ฉัน';setOrg(p.coords.latitude,p.coords.longitude,'ตำแหน่งของคุณ',true)},()=>{$('gps').textContent='📍 ใกล้ฉัน';alert('ขอตำแหน่งไม่สำเร็จ — เปิดสิทธิ์ตำแหน่งในเบราว์เซอร์ หรือใช้ระยะจากโรงเรียนแทน')},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
map.on('click',e=>setOrg(e.latlng.lat,e.latlng.lng,'จุดที่คุณแตะบนแผนที่',true));

fetch('shops.json').then(r=>r.json()).then(d=>{S=d;setOrg(SCHOOL.lat,SCHOOL.lng,SCHOOL.name,false)}).catch(()=>{$('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า</div>'});
</script>
</body>
</html>
